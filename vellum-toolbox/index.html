<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="index.js"></script>
    <style>
      /* =====================================================================
         Vellum 工具箱 · 外壳与工具 UI
         视觉依据：design-demos/B-native-pro.html（方向 B · Native Pro）
         落地评审：docs/14 ／ v0.2.1 修复：docs/16 ／ v0.2.2 修复：docs/17

         【真机踩坑后的三条硬纪律 —— 新增控件必须遵守】

         ① SVG 图标：**每个子元素都要显式写 fill / stroke**
            UXP 的 SVG 渲染器不把父节点的绘制属性继承给子元素，子元素会退回
            SVG 初值 fill:black / stroke:none → 闭合路径变黑块、线条图标在深色
            面板上直接"消失"。封装在 lib/icons.js 的 applyPaint() 里。

         ② 布局：**只用 display:flex（div 上），不用 display:inline-flex；
            不用 <button> 承载 flex 布局**
            真机表现：inline-flex 不可靠；<button> 上的 flex 不生效且文字被强制
            居中 —— 这正是"顶栏圆点与文字重叠/不对齐"「首页行文字居中、图标不
            显示」的成因。所以本版把导航行改成 div + 绝对定位，完全不依赖 flex。

         ③ **悬停浮层不得覆盖任何可悬停元素，且必须在"让帧之后"才量尺寸**
            （v0.2.2 新增，成因见 docs/17）
            · 浮层若压在色块上，指针就会落到浮层上 → 色块失焦 → 浮层消失 →
              色块复得焦点 → 浮层又出现 —— **振荡回路，表现为疯狂闪烁**。
              所以 .tip 的纵向位置一律落在 `.sw-grid` **之外**（上/下二选一）。
            · UXP 的布局是**异步**的：`display:none → block` 的同一同步块里
              `getBoundingClientRect()` 拿不到尺寸（真机实测 0x0）。
              几何一律等 `lib/dom.js` 的 settle()/轮询之后量。
            · 色块**不绑 mouseout**（子元素会造成成对事件）；隐藏由面板根节点
              统一判断"指针还在不在当前色块内部"。回归测试见 selfcheck S15。

         其余 UXP 改写纪律（v0.2.2 已按真机实测校正，⚠️ 标注意味着"能用但有前提"）
           ❌ display:grid                          → flex-wrap + 百分比宽度
           ❌ transition / animation                → 一律不做动效
           ❌ 伪元素 ::before/::after 承担结构       → 改用真实子元素
           ❌ flex gap                              → 间距一律 margin（真机实测无效）
           ✅ transform                             → 真机可用（v0.2.1 推翻旧结论）
           ✅ letter-spacing / var()                → 真机可用
           ⚠️ box-shadow                            → computed 有值，但可能被静默忽略
                                                      （需 CSSNextSupport，本项目未开）
                                                      → 视觉上仍用真实描边元素替代
           ⚠️ linear-gradient                       → 同上，能写但别拿它承担关键视觉
         ===================================================================== */

      /* ------------------------------------------------ 设计令牌 · 深色（默认） */
      :root {
        --vt-sans: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --vt-mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;

        --vt-panel: #323232;
        --vt-bar: #2b2b2b;
        --vt-surf: #3a3a3a;
        --vt-surf2: #2e2e2e;
        --vt-raised: #424242;
        --vt-sink: #262626;
        --vt-line: #4a4a4a;
        --vt-line2: #3f3f3f;
        --vt-edge: #1c1c1c;

        --vt-tx: #e6e6e6;
        --vt-tx2: #a2a2a2;
        --vt-tx3: #7e7e7e;
        --vt-tx4: #5f5f5f;

        --vt-ac: #1473e6;
        --vt-ac-hi: #2e8ff0;
        --vt-ok: #4cd07e;
        --vt-warn: #e8b65e;

        --vt-hair: rgba(127, 127, 127, 0.16);
      }

      /* ------------------------------------------------ 设计令牌 · 浅色 */
      @media (prefers-color-scheme: light) {
        :root:not(.vt-dark) {
          --vt-panel: #f0f0f0;
          --vt-bar: #e4e4e4;
          --vt-surf: #ffffff;
          --vt-surf2: #e8e8e8;
          --vt-raised: #dcdcdc;
          --vt-sink: #d6d6d6;
          --vt-line: #c4c4c4;
          --vt-line2: #d8d8d8;
          --vt-edge: #ababab;

          --vt-tx: #1a1a1a;
          --vt-tx2: #4d4d4d;
          --vt-tx3: #6e6e6e;
          --vt-tx4: #8c8c8c;

          --vt-ac: #1473e6;
          --vt-ac-hi: #0d63d0;
          --vt-ok: #1f9d55;
          --vt-warn: #b07a1e;

          --vt-hair: rgba(127, 127, 127, 0.22);
        }
      }

      :root.vt-light {
        --vt-panel: #f0f0f0;
        --vt-bar: #e4e4e4;
        --vt-surf: #ffffff;
        --vt-surf2: #e8e8e8;
        --vt-raised: #dcdcdc;
        --vt-sink: #d6d6d6;
        --vt-line: #c4c4c4;
        --vt-line2: #d8d8d8;
        --vt-edge: #ababab;

        --vt-tx: #1a1a1a;
        --vt-tx2: #4d4d4d;
        --vt-tx3: #6e6e6e;
        --vt-tx4: #8c8c8c;

        --vt-ac: #1473e6;
        --vt-ac-hi: #0d63d0;
        --vt-ok: #1f9d55;
        --vt-warn: #b07a1e;

        --vt-hair: rgba(127, 127, 127, 0.22);
      }

      /* ------------------------------------------------------------ 基础 */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: var(--vt-sans);
        /* 字号比设计稿整体 +1px：设计稿 9.5–12px 承中文在 Windows 下会糊。
           本版最小 11px，正文 13px。（用户明确要求「不接受糊」） */
        font-size: 13px;
        line-height: 1.5;
        color: var(--vt-tx);
        background: var(--vt-panel);
      }

      .mono {
        font-family: var(--vt-mono);
        font-size: 0.92em;
      }

      .grow {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* 图标容器。⚠️ 只写 flex，不写 inline-flex（真机不可靠）。
         全部使用点都在 flex 容器内，block 化后行为一致。 */
      .i {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .i svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 带 role="button" 的元素：复位浏览器默认外观。
         本版**不再使用 <button>** —— 真机上 button 上的 flex 不生效、
         文字被强制居中（见文件头 ②）。 */
      [role="button"] {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 0;
      }

      /* ---------------------------------------------------------- 外壳框架 */
      .app {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: var(--vt-panel);
      }

      .brandbar {
        flex: none;
        height: 2px;
        background: var(--vt-ac);
      }

      /* 顶栏：不用 gap，改用逐项 margin —— 间距不押在 gap 支持度上 */
      .bar {
        height: 32px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 0 8px;
        background: var(--vt-bar);
        border-bottom: 1px solid var(--vt-edge);
      }

      .back {
        width: 22px;
        height: 20px;
        margin-right: 6px;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--vt-tx2);
        border: 1px solid transparent;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .back:hover {
        background: var(--vt-raised);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      /* 首页收起返回键（旧版用 opacity .3，会在标题左侧留一个空位） */
      .back.is-off {
        display: none;
      }

      .back .i {
        width: 14px;
        height: 14px;
      }

      /* 首页顶栏左侧的品牌标（替代上面的空位）。图形标比例 256:164 */
      .bar-logo {
        display: none;
        width: 25px;
        height: 16px;
        margin-right: 7px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .bar-logo.is-on {
        display: block;
      }

      .bar-title {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-sub {
        font-size: 12px;
        color: var(--vt-tx3);
        margin-left: 7px;
        padding-left: 7px;
        border-left: 1px solid var(--vt-line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 环境 chip：圆点用「固定尺寸 + margin-right」保证不与文字重叠 */
      .bar-chip {
        display: flex;
        align-items: center;
        height: 20px;
        margin-left: 8px;
        padding: 0 7px;
        border-radius: 3px;
        border: 1px solid transparent;
        color: var(--vt-tx3);
        font-size: 11px;
        line-height: 1;
        flex: 0 0 auto;
        cursor: pointer;
      }

      .bar-chip:hover {
        background: var(--vt-raised);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      .led {
        display: block;
        width: 6px;
        height: 6px;
        min-width: 6px;
        flex: 0 0 6px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--vt-tx4);
      }

      .led.ok {
        background: var(--vt-ok);
      }

      .led.off {
        background: var(--vt-tx4);
      }

      .scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        /* v0.3.3：给"整页撑满型"页面（素材库）当定位上下文 ——
           素材库要把**滚动条收进瀑布流里**（见 .s-lib），绝对定位需要它。
           ⚠️ 下拉浮层 .fsel-pop 的包含块是 .fsel-wrap（position:relative），
              不受这一条影响。 */
        position: relative;
        background: var(--vt-panel);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .statusbar {
        flex: none;
        max-height: 92px;
        overflow-y: auto;
        padding: 7px 12px;
        background: var(--vt-bar);
        border-top: 1px solid var(--vt-edge);
        font-size: 12px;
        line-height: 1.5;
        color: var(--vt-tx2);
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ------------------------------------------------------- 首页 · 功能选择 */
      .hero {
        display: block;
        text-align: center;
        padding: 26px 20px 16px;
      }

      /* 品牌标（透明 PNG）。用 block + margin:auto 居中 —— 不依赖 flex */
      .hero-mark {
        display: block;
        width: 96px;
        height: 62px;
        margin: 0 auto 10px;
        object-fit: contain;
      }

      .hero-txt h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .hero-sub {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      /* 原生列表：普通块级堆叠（不用 flex-direction，少押一个特性） */
      .navlist {
        display: block;
        border-top: 1px solid var(--vt-line2);
      }

      /* 首页功能行 —— 布局**完全用绝对定位**，不依赖 flex：
           左 12px 图标（26×26）· 中间文字块（左对齐）· 右侧号位 chip · 最右箭头
         行高固定 54px，所有绝对坐标按它算，避免居中依赖 transform。 */
      .navitem {
        position: relative;
        display: block;
        height: 54px;
        padding: 0 34px 0 48px;
        border-bottom: 1px solid var(--vt-line2);
        text-align: left;
        cursor: pointer;
        overflow: hidden;
      }

      .navitem:hover,
      .navitem.is-hover {
        background: var(--vt-raised);
      }

      .navitem.is-planned {
        cursor: default;
      }

      .navitem.is-planned:hover {
        background: transparent;
      }

      .ni-ico {
        position: absolute;
        left: 12px;
        top: 14px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: var(--vt-surf);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx2);
      }

      .navitem.is-planned .ni-ico {
        color: var(--vt-tx3);
        background: var(--vt-surf2);
      }

      .ni-ico .i {
        width: 15px;
        height: 15px;
      }

      .ni-main {
        display: block;
        padding-top: 10px;
        text-align: left;
      }

      .ni-name {
        display: block;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--vt-tx);
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ni-desc {
        display: block;
        font-size: 12px;
        line-height: 1.35;
        color: var(--vt-tx3);
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .navitem.is-planned .ni-name {
        color: var(--vt-tx2);
      }

      /* 号位 chip（↑1…↑4）—— 视觉占位，见 docs/16 的说明 */
      .ni-key {
        position: absolute;
        right: 34px;
        top: 18px;
        height: 18px;
        line-height: 16px;
        padding: 0 6px;
        border-radius: 3px;
        background: var(--vt-surf);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx3);
        font-size: 11px;
        white-space: nowrap;
      }

      .navitem.is-planned .ni-key {
        background: var(--vt-surf2);
      }

      .ni-arrow {
        position: absolute;
        right: 11px;
        top: 20px;
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--vt-tx3);
      }

      .ni-arrow .i {
        width: 13px;
        height: 13px;
      }

      .tail {
        margin: 14px 12px 24px;
        padding: 10px 12px;
        border: 1px solid var(--vt-line2);
        border-radius: 4px;
        background: var(--vt-surf2);
      }

      .tail-title {
        margin: 0 0 7px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--vt-tx3);
      }

      .tail-item {
        display: block;
        margin: 0;
        padding: 4px 0;
        font-size: 12px;
        color: var(--vt-tx2);
        border-top: 1px solid var(--vt-hair);
        text-align: left;
      }

      /* ⚠️ 不用 :first-of-type —— 支持度不确定，改由 JS 给首行挂 .is-first */
      .tail-item.is-first {
        border-top: 0;
      }

      .tail-item .t-key {
        display: inline-block;
        min-width: 76px;
        color: var(--vt-tx2);
      }

      .tail-item .t-val {
        display: inline-block;
        color: var(--vt-tx4);
        word-break: break-all;
      }

      /* ------------------------------------------------------------ 调色板 */
      .s-palette {
        padding: 12px 14px 22px;
      }

      .fgbg-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px 12px;
        border-radius: 3px;
        background: var(--vt-surf2);
        border: 1px solid var(--vt-line2);
        margin-bottom: 14px;
      }

      .fgbg {
        position: relative;
        width: 42px;
        height: 30px;
        flex: 0 0 auto;
        margin-right: 12px;
      }

      .sq {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        border-radius: 2px;
        border: 1px solid var(--vt-edge);
      }

      .sq.fg {
        z-index: 2;
      }

      .sq.bg {
        left: 16px;
        top: 6px;
      }

      .ro {
        flex: 1 1 auto;
        min-width: 0;
      }

      .ro-hex {
        margin: 0;
        font-size: 12px;
        color: var(--vt-tx2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ro-pair {
        flex: 1 1 100%;
        display: block;
        min-width: 0;
        padding-top: 9px;
        margin-top: 9px;
        border-top: 1px solid var(--vt-line2);
      }

      .ro-row {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        color: var(--vt-tx3);
      }

      .ro-row .k {
        display: inline-block;
        min-width: 46px;
      }

      .ro-row b {
        font-size: 12px;
        color: var(--vt-tx);
        font-weight: 400;
      }

      .sec {
        display: block;
        margin: 0 0 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--vt-line2);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--vt-tx3);
      }

      .sec .sec-t {
        display: inline-block;
      }

      .sec-actions {
        display: inline-block;
        margin-left: 8px;
      }

      .sec-note {
        display: inline-block;
        margin-right: 8px;
        font-size: 11px;
        letter-spacing: 0;
        color: var(--vt-tx4);
      }

      /* ⚠️ inline-flex 在真机不可靠 → 用小按钮走 inline-block + 行高对齐 */
      .mini {
        display: inline-block;
        height: 22px;
        line-height: 20px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--vt-surf);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx2);
        font-size: 11px;
        letter-spacing: 0;
        cursor: pointer;
      }

      .mini:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .mini .i {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 5px;
        vertical-align: -1px;
      }

      .sw-wrap {
        position: relative;
        margin-bottom: 14px;
      }

      /* 设计稿是 CSS Grid 的 3 / 4 列；UXP 无 Grid → flex + 百分比宽度 */
      .sw-grid {
        display: flex;
        flex-wrap: wrap;
      }

      .sw {
        position: relative;
        cursor: pointer;
        border: 1px solid var(--vt-edge);
      }

      .sw-grid.brand .sw {
        width: 33.3333%;
        height: 40px;
      }

      .sw-grid.mine .sw {
        width: 25%;
        height: 32px;
      }

      /* hover / 选中反馈。
         ⚠️ 设计稿用 box-shadow，本项目最低版本（PS 2024）拿不到，
         改成**真实描边元素**向外扩 2px —— 视觉等价，且一定生效。 */
      .sw-ring {
        display: none;
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border: 2px solid var(--vt-ac);
        pointer-events: none;
      }

      .sw:hover .sw-ring,
      .sw.is-ho .sw-ring {
        display: block;
      }

      .sw:hover,
      .sw.is-ho {
        z-index: 2;
      }

      /* 「我的颜色」右上角的删除 ✕。
         ⚠️ 之前"看不到 ✕"不是 CSS 问题，是 SVG 不继承 fill → 黑叉压深底。
         这里同时把尺寸提到 18px、描边加粗，进一步提升可辨识度。 */
      .sw-del {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 12, 12, 0.6);
        color: #ffffff;
        cursor: pointer;
      }

      .sw-del:hover {
        background: rgba(0, 0, 0, 0.88);
      }

      .sw-del .i {
        width: 11px;
        height: 11px;
      }

      .tip {
        display: none;
        position: absolute;
        z-index: 9;
        padding: 3px 7px;
        border-radius: 3px;
        background: var(--vt-sink);
        border: 1px solid var(--vt-line);
        font-size: 11px;
        color: var(--vt-tx);
        white-space: nowrap;
        pointer-events: none;
      }

      .tip.is-on {
        display: block;
      }

      .empty {
        padding: 22px 12px;
        text-align: center;
      }

      .empty-t {
        margin: 0 0 5px;
        font-size: 12px;
        color: var(--vt-tx2);
      }

      .empty-s {
        margin: 0;
        font-size: 11px;
        color: var(--vt-tx3);
      }

      /* 操作提示条：行距按用户反馈加大（原来 gap 6px + 行高 1.45 偏挤） */
      .hints {
        display: block;
        margin-top: 6px;
        padding: 10px 11px 4px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
      }

      .hints p {
        display: block;
        margin: 0 0 9px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--vt-tx2);
      }

      .kbd {
        display: inline-block;
        margin-right: 8px;
        padding: 1px 6px;
        border-radius: 2px;
        background: var(--vt-raised);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx);
        font-size: 11px;
        line-height: 1.5;
        white-space: nowrap;
      }
      /* ------------------------------------------------------------ 素材库 (M2)
         数据来自「镜像」（见 D:\vellum-link\LINK-CONTRACT.md）。
         ⚠️ 三条纪律在本节各有一处体现，改之前先读文件头：
            · 网格是 **flex-wrap + 百分比**（无 Grid）；间距一律 margin（无 gap）
            · 所有可点元素是 `div[role="button"]`（无 <button>）
            · 缩略图容器**必须可见**（display:none 里 UXP 根本不加载图片）
      */
      /* 素材库页：**整页撑满 + 内部只有一个滚动区**（v0.3.3，用户要求）
         🔴 用户原话：「滚动条应当嵌入瀑布流中，不然还是会导致置入下面的图还要跑回顶部点击置入」。
         改法：页面拆成「固定区（库选择 / 筛选 / 详情置入）+ 滚动区（只有瀑布流）」，
         置入按钮永远在视野里，素材再多也不必滚回顶部。
         ⚠️ 用绝对定位撑满 `.scroll`：父级 .screen 是高 auto 的 block，
            `height:100%` 在那条链上解析不出高度（会退化成 auto）。 */
      .s-lib {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px 14px 0;
      }

      /* 固定区：不参与伸缩，永远可见（`.lib-body` 才是唯一的滚动区） */
      .lib-top,
      .lib-meta,
      .lib-metanote,
      .lib-bar,
      .lib-foot {
        flex: 0 0 auto;
      }

      /* 库切换行：chips 左、刷新右。用 flex-wrap 而不是 gap 排布 */
      .lib-top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        margin-bottom: 2px;
      }

      .lib-tabs {
        display: flex;
        flex-wrap: wrap;
        flex: 1 1 auto;
        min-width: 0;
      }

      .ltab {
        display: inline-block;
        height: 26px;
        line-height: 24px;
        padding: 0 10px;
        margin: 0 6px 6px 0;
        border-radius: 3px;
        border: 1px solid var(--vt-line);
        background: var(--vt-surf2);
        color: var(--vt-tx2);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .ltab:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .ltab.is-on {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .ltab .lt-n {
        margin-left: 6px;
        font-size: 11px;
        opacity: 0.75;
      }

      .lib-refresh {
        margin: 0 0 6px 0;
        flex: 0 0 auto;
      }

      .lib-meta {
        display: block;
        margin: 0 0 9px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-tx4);
        word-break: break-all;
      }

      /* 「镜像里只有 N 个库」的如实提示 —— 只在不足 2 个库时显示（默认 display:none） */
      .lib-metanote {
        margin: -5px 0 9px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-warn);
        word-break: break-all;
      }

      /* 筛选区：最多三行（顶层分组 / 子组 / 来源）。
         外层改成 block —— 行与行要竖着排，flex 行会把三行并排。
         每行自己 flex-wrap：窄面板下 chips 要能换行，所以必须给底部间距，
         不能像旧版那样只留右间距（一换行上下就贴住了）。 */
      .lib-bar {
        display: block;
        min-height: 22px;
        margin-bottom: 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--vt-line2);
      }

      .frow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
      }

      /* chips 装在 .fchips 里（把左侧剩余宽度吃满）——
         这样**行尾还能再挂一个下拉**（通用库的二级子类就挂在同一行的最右边）。 */
      .fchips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        flex: 1 1 auto;
        min-width: 0;
      }

      .frow .fchip {
        margin: 0 6px 4px 0;
      }

      /* 子组行：缩进一层，一眼看出它在父组下面 */
      .frow.mid {
        padding-left: 10px;
      }

      .frow.src {
        margin-top: 2px;
      }

      .frow-lb {
        margin: 0 6px 4px 0;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .fchip {
        display: inline-block;
        height: 22px;
        line-height: 20px;
        padding: 0 8px;
        margin: 0 6px 0 0;
        border-radius: 3px;
        border: 1px solid var(--vt-line2);
        background: transparent;
        color: var(--vt-tx3);
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }

      /* 子组 chip 比父组小一号，层级关系光靠缩进在小面板里看不出来 */
      .fchip.sub {
        height: 20px;
        line-height: 18px;
        padding: 0 7px;
        font-size: 10px;
      }

      /* ── 自绘下拉（v0.3.0；v0.3.1 起「项目」与「二层子类」共用）
         为什么自绘：原生 <select> 外观改不动（与"样式沿用现有风格"冲突），
         而 Spectrum sp-picker 真机实测未注册 ⇒ 不可用。见 docs/25。 */
      .fsel-wrap {
        position: relative;
        display: inline-block;
        margin: 0 6px 4px 0;
      }

      /* 挂在**行尾**的下拉：自身不伸缩、贴右侧，宽度封顶（长名字靠 .fs-t 截断） */
      .fsel-wrap.push {
        flex: 0 0 auto;
        align-self: center;
        margin: 0 0 4px 8px;
        max-width: 150px;
      }

      .fsel {
        display: inline-block;
        max-width: 100%;
        height: 22px;
        line-height: 20px;
        padding: 0 6px 0 8px;
        border-radius: 3px;
        border: 1px solid var(--vt-line);
        background: var(--vt-surf);
        color: var(--vt-tx);
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }

      /* 触发条里的三个片段一律 `vertical-align: top`（内容盒正好 20px），
         否则"截断用的 inline-block"与"纯文本"基线不一致，三个片段会高低错位。 */
      .fsel .fs-t {
        display: inline-block;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: top;
      }

      /* 计数 / 箭头：**必须也做成 20px 高的 inline-block**，光写 `vertical-align: top` 不够 ——
         `top` 对**纯文本**是把「内容区顶部」贴到行盒顶（内容区只有 ~13px、行盒 20px
         ⇒ 它比居中位置**高约 3px**），而对 inline-block 才是「盒子顶贴行盒顶」（盒内文字居中）。
         两者混用 = 用户 2026-10-11 报的「数字比文字高一点」。 */
      .fsel .fs-n,
      .fsel .fs-cv {
        display: inline-block;
        height: 20px;
        line-height: 20px;
        vertical-align: top;
      }

      .fsel:hover {
        border-color: var(--vt-tx4);
      }

      .fsel.is-on {
        border-color: var(--vt-ac);
      }

      .fsel .fs-n {
        margin-left: 5px;
        opacity: 0.7;
      }

      .fsel .fs-cv {
        margin-left: 6px;
        font-size: 10px;
        color: var(--vt-tx3);
      }

      /* 展开的列表。
         ⚠️ 三条硬约束：
           ① 与触发条之间留 6px 间隙、且**不覆盖触发条本身**（覆盖会让指针一进入浮层，
              触发条就"失焦"，若隐藏逻辑再绑 hover 就是振荡回路 —— 调色板那次的教训）；
           ② **必须落在滚动容器 `.scroll` 之内** —— 它同时有 `overflow-y:auto` 与
              `overflow-x:hidden`，**越界会被裁掉**。这条在自检 S20c 里是**可测不变量**；
           ③ 因此浮层是**右对齐**展开的（`right:0` 而非 `left:0`）——
              这两个下拉都贴在**行尾**，往右展开必然越界。 */
      .fsel-pop {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 6px;
        min-width: 100%;
        max-width: 230px;
        max-height: 168px;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 30;
        padding: 3px;
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        background: var(--vt-surf);
      }

      .fsel-wrap.is-open .fsel-pop {
        display: block;
      }

      .fopt {
        display: flex;
        align-items: center;
        padding: 3px 7px;
        border-radius: 2px;
        font-size: 11px;
        color: var(--vt-tx2);
        white-space: nowrap;
        cursor: pointer;
      }

      .fopt:hover {
        background: var(--vt-surf2);
        color: var(--vt-tx);
      }

      .fopt.is-on {
        color: var(--vt-tx);
      }

      /* `min-width:0` + 截断：选项名可能很长（项目名），浮层又有 max-width */
      .fopt .fo-t {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fopt .fo-n {
        flex: 0 0 auto;
        margin-left: 12px;
        font-size: 10px;
        opacity: 0.65;
      }

      /* ── 落点：九宫格（v0.3.0；v0.3.1 起「落点」二字移到九宫格**上方**）
         3×3 用 flex-wrap + 百分比（不用 Grid、不用 gap） */
      .anchor-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 0 0 auto;
        margin-left: 14px;
      }

      .anchor-hd {
        margin-bottom: 4px;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .anchors {
        display: flex;
        flex-wrap: wrap;
        width: 96px;
      }

      .anchor-cell {
        width: 33.3333%;
        height: 22px;
        padding: 3px;
        cursor: pointer;
      }

      .anchor-dot {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 2px;
        border: 1px solid var(--vt-line2);
        background: transparent;
      }

      .anchor-cell:hover .anchor-dot {
        border-color: var(--vt-tx4);
      }

      .anchor-cell.is-on .anchor-dot {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
      }

      /* ⚠️ 已废弃：v0.3.1 起「落点」二字改用 `.anchor-hd`（在九宫格上方），
         说明文字挪到置入按钮下方。留这条只是防止老标记写法意外错位。 */
      .anchor-wrap .lf-note {
        margin-left: 0;
      }

      /* 顶部行里的「项目」下拉（仅任务库）：紧挨刷新按钮左侧 */
      .lib-proj {
        flex: 0 0 auto;
        margin: 0 0 6px 6px;
        max-width: 55%;
      }

      .fchip:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .fchip.is-on {
        background: var(--vt-surf);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      .fchip .fc-n {
        margin-left: 5px;
        opacity: 0.7;
      }

      .lib-count {
        font-size: 11px;
        color: var(--vt-tx4);
      }

      /* 唯一的滚动区（v0.3.3）：滚动条只出现在瀑布流这一块里。
         `min-height:0` 是 flex 子项能真正滚起来的必要条件（否则会被内容撑高）。 */
      .lib-body {
        display: block;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 22px;
      }

      /* 瀑布流（v0.3.4，用户要求"缩略图容器与缩略图比例一致"）
         ══════════════════════════════════════════════════════════════
         两列**各自纵向堆叠**，不再用 flex-wrap —— 卡片高度随缩略图比例变化，
         wrap 会按"行高 = 本行最高"对齐，短卡片下面留一大片空隙（也就不是瀑布流了）。
         分派规则在 JS：每张卡片按"当前累计高度较小的一列"投放（见 library.js renderGrid）。
         ⚠️ 网格仍是 flex + 百分比，不用 Grid / gap（UXP 不支持）。 */
      .lib-grid {
        display: flex;
        align-items: flex-start;
        margin: 0 -5px;
      }

      .lib-col {
        width: 50%;
        display: flex;
        flex-direction: column;
      }

      .card {
        width: 100%;
        padding: 0 5px 10px;
        cursor: pointer;
      }

      .card-in {
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
        overflow: hidden;
      }

      .card:hover .card-in,
      .card.is-on .card-in {
        border-color: var(--vt-ac);
      }

      /* 缩略图区：**高度由 JS 按缩略图比例算好写成 inline style**
         （v0.3.4 瀑布流：1600×2200 的图就该比 2408×2048 的图高一截）。
         这里的 120px 只是**没算出比例时的保底**（例如 asset 缺 width/height
         且缩略图还没加载完），不参与正常路径。 */
      .card-th {
        position: relative;
        height: 120px;
        background: var(--vt-sink);
        border-bottom: 1px solid var(--vt-line2);
        overflow: hidden;
      }

      /* 容器比例 = 图片比例 ⇒ contain/cover 等价；用 cover 是为了万一缩略图
         与原图比例有一两像素取整误差时**不留白边**（宁可裁掉半点边缘）。 */
      .card-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-ph {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .card-ext {
        position: absolute;
        right: 0;
        top: 0;
        padding: 1px 4px;
        background: rgba(12, 12, 12, 0.62);
        color: #ffffff;
        font-size: 10px;
        line-height: 1.5;
      }

      .card-miss {
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 1px 5px;
        background: #8e2f2f;
        color: #ffffff;
        font-size: 10px;
        line-height: 1.6;
      }

      /* 来源角标（契约 §5.4 可选 asset.source）
         —— 只在「两种来源混排」时才出现；右下角与左下角的「原文件丢失」对称。
         「我的」用主色实底，和扩展名/丢失那种"中性深底"区分开。 */
      .card-src {
        position: absolute;
        right: 0;
        bottom: 0;
        padding: 1px 5px;
        background: rgba(12, 12, 12, 0.62);
        color: #ffffff;
        font-size: 10px;
        line-height: 1.6;
      }

      .card-src.is-user {
        background: var(--vt-ac);
      }

      .card-nm {
        display: block;
        padding: 6px 7px 1px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--vt-tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-mt {
        display: block;
        padding: 0 7px 7px;
        font-size: 11px;
        color: var(--vt-tx4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 选中详情 + 置入（v0.3.2 起**挪到网格上方** —— 素材多时不必滚到底部去按置入） */
      .lib-foot {
        margin: 0 0 10px;
        padding: 9px 10px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
      }

      .lf-hint {
        display: block;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .lf-t {
        display: block;
        margin-bottom: 3px;
        font-size: 12px;
        color: var(--vt-tx);
        word-break: break-all;
      }

      .lf-s {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-tx3);
        word-break: break-all;
      }

      .lf-path {
        font-size: 10px;
        color: var(--vt-tx4);
      }

      /* 素材信息与动作区之间的分隔线：**细、不抢视线**（用户要求"不用太明显"） */
      .lf-sep {
        height: 1px;
        margin: 9px 0;
        background: var(--vt-line2);
      }

      /* 动作区（v0.3.1 按用户要求改排）：**左＝置入按钮（说明文字在它下方）、右＝落点九宫格** */
      .lf-act {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
      }

      .lf-act-l {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1 1 auto;
        min-width: 0;
      }

      .lf-note {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.5;
        color: var(--vt-tx4);
        word-break: break-all;
      }

      /* 「不能置入」的提示（原文件丢失 / 类型不支持）—— 用主题里的警示色，两种主题都读得清 */
      .lf-note.is-warn {
        color: var(--vt-warn);
      }

      /* 主按钮（复用 .mini 的形状）+ 不可用态 */
      .mini.pri {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .mini.pri:hover {
        background: var(--vt-ac-hi);
        border-color: var(--vt-ac-hi);
        color: #ffffff;
      }

      .mini.is-off {
        opacity: 0.45;
        cursor: default;
      }

      .mini.is-off:hover {
        border-color: var(--vt-line);
        color: var(--vt-tx2);
      }

      .mini.pri.is-off:hover {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .lib-retry {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="app" id="vt-app">
      <div class="brandbar"></div>

      <header class="bar" id="vt-bar">
        <div class="back is-off" id="vt-back" role="button" tabindex="0" title="返回"></div>
        <img class="bar-logo" id="vt-logo" src="icons/logo-mark.png" alt="Vellum" />
        <span class="bar-title" id="vt-title">Vellum 工具箱</span>
        <span class="bar-sub" id="vt-sub"></span>
        <span class="grow"></span>
        <div class="bar-chip" id="vt-chip" role="button" tabindex="0" title="点击查看运行环境">
          <i class="led" id="vt-led"></i><span class="mono" id="vt-env">…</span>
        </div>
      </header>

      <div class="scroll" id="vt-body">
        <section class="screen active" id="vt-home"></section>
        <section class="screen" id="vt-tool-view"></section>
      </div>

      <div class="statusbar" id="vt-status">就绪。</div>
    </div>
  </body>
</html>

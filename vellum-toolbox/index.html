<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="index.js"></script>
    <style>
      /* =====================================================================
         Vellum 工具箱 · 外壳与工具 UI
         视觉依据：design-demos/B-native-pro.html（方向 B · Native Pro）
         落地评审：docs/14 ／ v0.2.1 修复：docs/16 ／ v0.2.2 修复：docs/17

         【真机踩坑后的三条硬纪律 —— 新增控件必须遵守】

         ① SVG 图标：**每个子元素都要显式写 fill / stroke**
            UXP 的 SVG 渲染器不把父节点的绘制属性继承给子元素，子元素会退回
            SVG 初值 fill:black / stroke:none → 闭合路径变黑块、线条图标在深色
            面板上直接"消失"。封装在 lib/icons.js 的 applyPaint() 里。

         ② 布局：**只用 display:flex（div 上），不用 display:inline-flex；
            不用 <button> 承载 flex 布局**
            真机表现：inline-flex 不可靠；<button> 上的 flex 不生效且文字被强制
            居中 —— 这正是"顶栏圆点与文字重叠/不对齐"「首页行文字居中、图标不
            显示」的成因。所以本版把导航行改成 div + 绝对定位，完全不依赖 flex。

         ③ **悬停浮层不得覆盖任何可悬停元素，且必须在"让帧之后"才量尺寸**
            （v0.2.2 新增，成因见 docs/17）
            · 浮层若压在色块上，指针就会落到浮层上 → 色块失焦 → 浮层消失 →
              色块复得焦点 → 浮层又出现 —— **振荡回路，表现为疯狂闪烁**。
              所以 .tip 的纵向位置一律落在 `.sw-grid` **之外**（上/下二选一）。
            · UXP 的布局是**异步**的：`display:none → block` 的同一同步块里
              `getBoundingClientRect()` 拿不到尺寸（真机实测 0x0）。
              几何一律等 `lib/dom.js` 的 settle()/轮询之后量。
            · 色块**不绑 mouseout**（子元素会造成成对事件）；隐藏由面板根节点
              统一判断"指针还在不在当前色块内部"。回归测试见 selfcheck S15。

         其余 UXP 改写纪律（v0.2.2 已按真机实测校正，⚠️ 标注意味着"能用但有前提"）
           ❌ display:grid                          → flex-wrap + 百分比宽度
           ❌ transition / animation                → 一律不做动效
           ❌ 伪元素 ::before/::after 承担结构       → 改用真实子元素
           ❌ flex gap                              → 间距一律 margin（真机实测无效）
           ✅ transform                             → 真机可用（v0.2.1 推翻旧结论）
           ✅ letter-spacing / var()                → 真机可用
           ⚠️ box-shadow                            → computed 有值，但可能被静默忽略
                                                      （需 CSSNextSupport，本项目未开）
                                                      → 视觉上仍用真实描边元素替代
           ⚠️ linear-gradient                       → 同上，能写但别拿它承担关键视觉
         ===================================================================== */

      /* ------------------------------------------------ 设计令牌 · 深色（默认） */
      :root {
        --vt-sans: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --vt-mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;

        --vt-panel: #323232;
        --vt-bar: #2b2b2b;
        --vt-surf: #3a3a3a;
        --vt-surf2: #2e2e2e;
        --vt-raised: #424242;
        --vt-sink: #262626;
        --vt-line: #4a4a4a;
        --vt-line2: #3f3f3f;
        --vt-edge: #1c1c1c;

        --vt-tx: #e6e6e6;
        --vt-tx2: #a2a2a2;
        --vt-tx3: #7e7e7e;
        --vt-tx4: #5f5f5f;

        --vt-ac: #1473e6;
        --vt-ac-hi: #2e8ff0;
        --vt-ok: #4cd07e;
        --vt-warn: #e8b65e;
        --vt-err: #e06d5c;

        --vt-hair: rgba(127, 127, 127, 0.16);
      }

      /* ------------------------------------------------ 设计令牌 · 浅色 */
      @media (prefers-color-scheme: light) {
        :root:not(.vt-dark) {
          --vt-panel: #f0f0f0;
          --vt-bar: #e4e4e4;
          --vt-surf: #ffffff;
          --vt-surf2: #e8e8e8;
          --vt-raised: #dcdcdc;
          --vt-sink: #d6d6d6;
          --vt-line: #c4c4c4;
          --vt-line2: #d8d8d8;
          --vt-edge: #ababab;

          --vt-tx: #1a1a1a;
          --vt-tx2: #4d4d4d;
          --vt-tx3: #6e6e6e;
          --vt-tx4: #8c8c8c;

          --vt-ac: #1473e6;
          --vt-ac-hi: #0d63d0;
          --vt-ok: #1f9d55;
          --vt-warn: #b07a1e;
          --vt-err: #bb3a2b;

          --vt-hair: rgba(127, 127, 127, 0.22);
        }
      }

      :root.vt-light {
        --vt-panel: #f0f0f0;
        --vt-bar: #e4e4e4;
        --vt-surf: #ffffff;
        --vt-surf2: #e8e8e8;
        --vt-raised: #dcdcdc;
        --vt-sink: #d6d6d6;
        --vt-line: #c4c4c4;
        --vt-line2: #d8d8d8;
        --vt-edge: #ababab;

        --vt-tx: #1a1a1a;
        --vt-tx2: #4d4d4d;
        --vt-tx3: #6e6e6e;
        --vt-tx4: #8c8c8c;

        --vt-ac: #1473e6;
        --vt-ac-hi: #0d63d0;
        --vt-ok: #1f9d55;
        --vt-warn: #b07a1e;
        --vt-err: #bb3a2b;

        --vt-hair: rgba(127, 127, 127, 0.22);
      }

      /* ------------------------------------------------------------ 基础 */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: var(--vt-sans);
        /* 字号比设计稿整体 +1px：设计稿 9.5–12px 承中文在 Windows 下会糊。
           本版最小 11px，正文 13px。（用户明确要求「不接受糊」） */
        font-size: 13px;
        line-height: 1.5;
        color: var(--vt-tx);
        background: var(--vt-panel);
      }

      .mono {
        font-family: var(--vt-mono);
        font-size: 0.92em;
      }

      .grow {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* 图标容器。⚠️ 只写 flex，不写 inline-flex（真机不可靠）。
         全部使用点都在 flex 容器内，block 化后行为一致。 */
      .i {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .i svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 带 role="button" 的元素：复位浏览器默认外观。
         本版**不再使用 <button>** —— 真机上 button 上的 flex 不生效、
         文字被强制居中（见文件头 ②）。 */
      [role="button"] {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 0;
      }

      /* ---------------------------------------------------------- 外壳框架 */
      .app {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: var(--vt-panel);
      }

      .brandbar {
        flex: none;
        height: 2px;
        background: var(--vt-ac);
      }

      /* 顶栏：不用 gap，改用逐项 margin —— 间距不押在 gap 支持度上 */
      .bar {
        height: 32px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 0 8px;
        background: var(--vt-bar);
        border-bottom: 1px solid var(--vt-edge);
      }

      .back {
        width: 22px;
        height: 20px;
        margin-right: 6px;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--vt-tx2);
        border: 1px solid transparent;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .back:hover {
        background: var(--vt-raised);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      /* 首页收起返回键（旧版用 opacity .3，会在标题左侧留一个空位） */
      .back.is-off {
        display: none;
      }

      .back .i {
        width: 14px;
        height: 14px;
      }

      /* 首页顶栏左侧的品牌标（替代上面的空位）。图形标比例 256:164 */
      .bar-logo {
        display: none;
        width: 25px;
        height: 16px;
        margin-right: 7px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .bar-logo.is-on {
        display: block;
      }

      .bar-title {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-sub {
        font-size: 12px;
        color: var(--vt-tx3);
        margin-left: 7px;
        padding-left: 7px;
        border-left: 1px solid var(--vt-line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 环境 chip：圆点用「固定尺寸 + margin-right」保证不与文字重叠 */
      .bar-chip {
        display: flex;
        align-items: center;
        height: 20px;
        margin-left: 8px;
        padding: 0 7px;
        border-radius: 3px;
        border: 1px solid transparent;
        color: var(--vt-tx3);
        font-size: 11px;
        line-height: 1;
        flex: 0 0 auto;
        cursor: pointer;
      }

      .bar-chip:hover {
        background: var(--vt-raised);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      .led {
        display: block;
        width: 6px;
        height: 6px;
        min-width: 6px;
        flex: 0 0 6px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--vt-tx4);
      }

      .led.ok {
        background: var(--vt-ok);
      }

      .led.off {
        background: var(--vt-tx4);
      }

      .scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        /* v0.3.3：给"整页撑满型"页面（素材库）当定位上下文 ——
           素材库要把**滚动条收进瀑布流里**（见 .s-lib），绝对定位需要它。
           ⚠️ 下拉浮层 .fsel-pop 的包含块是 .fsel-wrap（position:relative），
              不受这一条影响。 */
        position: relative;
        background: var(--vt-panel);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      /* 状态条 = 常驻体检 chip（定高、不会被滚走）+ 可滚动的消息区。
         ⚠️ 拆成两行是**必须**的：setStatus() 会把整块 textContent 覆盖掉 ——
            若体检摘要与消息共用一个节点，任何一次 setStatus 都会把摘要抹掉。
         ⚠️ 布局只用 display:flex（div 上），不用 inline-flex、不用 <button>（真机纪律 ②）。 */
      .statusbar {
        flex: none;
        display: flex;
        flex-direction: column;
        background: var(--vt-bar);
        border-top: 1px solid var(--vt-edge);
      }

      .vchip {
        flex: none;
        display: flex;
        align-items: center;
        height: 22px;
        padding: 0 12px;
        font-size: 11px;
        line-height: 1;
        color: var(--vt-tx3);
        cursor: pointer;
      }

      .vchip:hover {
        background: var(--vt-raised);
        color: var(--vt-tx);
      }

      /* 长文本一律省略号，chip 只占一行 */
      .vchip-tx {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      /* 体检状态点：复用 .led 的尺寸/位置，只换颜色 */
      .vchip.is-warn .led {
        background: var(--vt-warn);
      }

      .vchip.is-fatal .led {
        background: var(--vt-err);
      }

      .vchip.is-unknown .led {
        background: var(--vt-tx4);
      }

      /* 撤销入口（v0.6.0）：只在"有可撤回的批量操作"时出现。
         复用 .vchip 的交互与排版，只把点换成暖色 —— 它是**操作**入口，不是严重度指示。
         ⚠️ 与体检 chip 分开成两个节点（同状态条里），这样各自刷新互不干扰
            （跟"摘要不跟 setStatus 共用节点"是同一条理由）。 */
      .vchip.is-act {
        color: var(--vt-tx2);
      }

      .vchip.is-act .led {
        background: var(--vt-warn);
      }

      .stx {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 70px;
        overflow-y: auto;
        padding: 7px 12px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--vt-tx2);
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ------------------------------------------------------ 出图体检（M5）

         ⚠️ 严重度用**文字标签**（合格/提醒/必须处理/无结论/信息），不用 emoji 图标 ——
            本项目约定界面不用 emoji 当图标；而且「无结论」这一档必须一眼可见。
         ⚠️ 按钮用 <div role="button">，不用 <button> —— 真机上 button 不吃
            display:flex 且强制文字居中（index.html 头部纪律 ②）。 */
      .insp-sum {
        padding: 10px 12px;
        background: var(--vt-sink);
        border-bottom: 1px solid var(--vt-line2);
      }

      .insp-doc {
        font-size: 13px;
        color: var(--vt-tx);
        word-break: break-word;
      }

      .insp-basis {
        margin-top: 4px;
        font-size: 11px;
        color: var(--vt-tx3);
        line-height: 1.5;
      }

      .insp-row {
        display: flex;
        align-items: flex-start;
        padding: 7px 12px;
        border-bottom: 1px solid var(--vt-hair);
      }

      .insp-mark {
        flex: 0 0 56px;
        width: 56px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-tx3);
      }

      .insp-lb {
        flex: 0 0 84px;
        width: 84px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--vt-tx3);
      }

      .insp-vl {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 12px;
        line-height: 1.6;
        color: var(--vt-tx);
        word-break: break-word;
      }

      .insp-note {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.5;
        color: var(--vt-tx3);
      }

      .insp-row.is-warn .insp-mark,
      .insp-row.is-warn .insp-vl {
        color: var(--vt-warn);
      }

      .insp-row.is-fatal .insp-mark,
      .insp-row.is-fatal .insp-vl {
        color: var(--vt-err);
      }

      .insp-row.is-unknown .insp-mark {
        color: var(--vt-tx4);
      }

      .insp-empty {
        padding: 14px 12px;
        font-size: 12px;
        color: var(--vt-tx2);
        line-height: 1.6;
      }

      .insp-foot {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid var(--vt-line2);
      }

      .insp-btn {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        height: 24px;
        padding: 0 12px;
        margin-right: 10px;
        font-size: 12px;
        color: var(--vt-tx);
        background: var(--vt-raised);
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        cursor: pointer;
      }

      .insp-btn:hover {
        border-color: var(--vt-ac);
        color: var(--vt-ac-hi);
      }

      .insp-hint {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        color: var(--vt-tx3);
      }

      /* --------------------------------------------------- 导出审核版（M5 第 4 步）
         ⚠️ 一律**不赌未验证控件**：真机自检 S23 读数显示 sp-textfield / sp-picker /
            sp-button **全部「未注册」**（基准对照逐项相同 ⇒ 读数可信），`<input>` 本
            项目也从没验过 ⇒ 所以这里是「div role=button + 自绘步进器」，与 table.js
            当时的处理一致。
         ⚠️ 按钮一律 <div role="button">，理由是 `<button>` 在真机不吃 display:flex
            且强制文字居中（本文件头部纪律 ②）。 */
      .rv {
        display: block;
        position: relative;
      }

      .rv-sum {
        padding: 10px 12px;
        background: var(--vt-sink);
        border-bottom: 1px solid var(--vt-line2);
      }

      .rv-doc {
        font-size: 13px;
        color: var(--vt-tx);
        word-break: break-word;
      }

      .rv-basis {
        margin-top: 4px;
        font-size: 11px;
        color: var(--vt-tx3);
        line-height: 1.5;
      }

      .rv-sec {
        padding: 10px 12px 12px;
        border-bottom: 1px solid var(--vt-hair);
      }

      .rv-h {
        font-size: 11px;
        color: var(--vt-tx3);
        margin-bottom: 7px;
      }

      .rv-chips {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .rv-chip {
        display: flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        margin: 0 6px 6px 0;
        font-size: 12px;
        color: var(--vt-tx2);
        background: var(--vt-surf);
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        cursor: pointer;
      }

      .rv-chip:hover {
        border-color: var(--vt-ac);
        color: var(--vt-tx);
      }

      .rv-chip.is-on {
        color: #ffffff;
        background: var(--vt-ac);
        border-color: var(--vt-ac);
      }

      .rv-step {
        display: flex;
        align-items: center;
      }

      .rv-step.is-off {
        opacity: 0.45;
      }

      .rv-sbtn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 24px;
        font-size: 14px;
        color: var(--vt-tx);
        background: var(--vt-raised);
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        cursor: pointer;
      }

      .rv-sbtn:hover {
        border-color: var(--vt-ac);
        color: var(--vt-ac-hi);
      }

      .rv-sval {
        min-width: 62px;
        height: 24px;
        margin: 0 6px;
        padding: 0 6px;
        font-family: var(--vt-mono);
        font-size: 12px;
        line-height: 24px;
        text-align: center;
        color: var(--vt-tx);
        background: var(--vt-sink);
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
      }

      .rv-prev {
        padding: 8px 10px;
        background: var(--vt-sink);
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
      }

      .rv-pline {
        font-family: var(--vt-mono);
        font-size: 11px;
        line-height: 1.65;
        color: var(--vt-tx);
        word-break: break-word;
      }

      .rv-ptag {
        margin-top: 2px;
        font-family: var(--vt-mono);
        font-size: 11px;
        text-align: right;
        color: var(--vt-err);
      }

      /* 迷你参数条：用**导出时的真实配色**画一条，让黑白主题一眼可见 */
      .rv-fake {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
      }

      .rv-fake .rv-pline {
        color: inherit;
      }

      .rv-frow {
        display: flex;
        align-items: center;
        margin-top: 4px;
      }

      .rv-fbasis {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        min-width: 0;
        font-size: 11px;
        color: inherit;
        word-break: break-word;
      }

      .rv-flogo {
        width: 20px;
        height: 13px;
        margin-right: 4px;
      }

      .rv-ftag {
        flex: 0 0 auto;
        font-size: 11px;
        margin-left: 8px;
      }

      .rv-meta {
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-tx2);
        word-break: break-word;
      }

      .rv-note {
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.55;
        color: var(--vt-tx3);
        word-break: break-word;
      }

      .rv-hint {
        font-size: 11px;
        line-height: 1.5;
        color: var(--vt-tx3);
      }

      .rv-out {
        display: flex;
        align-items: center;
      }

      .rv-outname {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 12px;
        color: var(--vt-tx);
        word-break: break-word;
        margin-right: 8px;
      }

      .rv-foot {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid var(--vt-line2);
        background: var(--vt-bar);
      }

      .rv-btn {
        display: flex;
        align-items: center;
        height: 24px;
        padding: 0 12px;
        margin-right: 8px;
        font-size: 12px;
        color: var(--vt-tx);
        background: var(--vt-raised);
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        cursor: pointer;
      }

      .rv-btn:hover {
        border-color: var(--vt-ac);
        color: var(--vt-ac-hi);
      }

      .rv-btn.is-primary {
        color: #ffffff;
        background: var(--vt-ac);
        border-color: var(--vt-ac);
      }

      .rv-btn.is-primary:hover {
        background: var(--vt-ac-hi);
        color: #ffffff;
      }

      .rv-btn.is-busy {
        opacity: 0.6;
      }

      .rv-ressum {
        font-size: 12px;
        line-height: 1.55;
        color: var(--vt-tx);

      }

      .rv-ressum.is-ok {
        color: var(--vt-ok);
      }

      .rv-ressum.is-bad {
        color: var(--vt-err);
      }

      /* 出血三态浮层：**先于任何模态**出现；铺满整个面板，点按钮才继续 */
      .rv-mask {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;

        flex-direction: column;

      .rv-dlg {

      .rv-dlg-t {
        font-size: 13px;
        color: var(--vt-tx);
        margin-bottom: 6px;
      }

      .rv-dlg-sub {
        font-size: 11px;
        line-height: 1.55;
        color: var(--vt-tx3);

      .rv-dlg-row {
        display: flex;
        align-items: center;
        height: 26px;
        padding: 0 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--vt-tx);
        background: var(--vt-sink);
        border: 1px solid var(--vt-line2);

      .rv-dlg-mm {

      .rv-dlg-foot {

      /* ------------------------------------------------------- 首页 · 功能选择 */
      .hero {
        display: block;
        text-align: center;
        padding: 26px 20px 16px;
      }

      /* 品牌标（透明 PNG）。用 block + margin:auto 居中 —— 不依赖 flex */
      .hero-mark {
        display: block;
        width: 96px;
        height: 62px;
        margin: 0 auto 10px;
        object-fit: contain;
      }

      .hero-txt h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .hero-sub {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--vt-tx4);

      /* 原生列表：普通块级堆叠（不用 flex-direction，少押一个特性） */
      .navlist {
        display: block;
        border-top: 1px solid var(--vt-line2);

      /* 首页功能行 —— 布局**完全用绝对定位**，不依赖 flex：
           左 12px 图标（26×26）· 中间文字块（左对齐）· 右侧号位 chip · 最右箭头
         行高固定 54px，所有绝对坐标按它算，避免居中依赖 transform。 */
      .navitem {
        position: relative;
        display: block;
        height: 54px;

      .navitem:hover,
      .navitem.is-hover {

        background: var(--vt-surf);
        border: 1px solid var(--vt-line);

      .ni-ico .i {

      .ni-name {

        font-size: 13px;

      .ni-desc {

        line-height: 1.35;

        text-align: left;
        white-space: nowrap;

      .navitem.is-planned .ni-name {

      /* 号位 chip（↑1…↑4）—— 视觉占位，见 docs/16 的说明 */
      .ni-key {

      .tail-item.is-first {

      /* ------------------------------------------------------------ 调色板 */
      .s-palette {
        padding: 12px 14px 22px;
      }

      .fgbg-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px 12px;
        border-radius: 3px;
        background: var(--vt-surf2);
        border: 1px solid var(--vt-line2);
        margin-bottom: 14px;
      }

      .fgbg {
        position: relative;
        width: 42px;

      .sq {

      .ro-pair {

      .sec .sec-t {

      .sec-note {
        display: inline-block;

      /* ⚠️ inline-flex 在真机不可靠 → 用小按钮走 inline-block + 行高对齐 */
      .mini {
        display: inline-block;
        height: 22px;
        line-height: 20px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--vt-surf);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx2);
        font-size: 11px;

      }

      .mini:hover {

      .sw-wrap {

        margin-bottom: 14px;
      }

      /* 设计稿是 CSS Grid 的 3 / 4 列；UXP 无 Grid → flex + 百分比宽度 */
      .sw-grid {
        display: flex;
        flex-wrap: wrap;
      }

      .sw {
        position: relative;
        cursor: pointer;
        border: 1px solid var(--vt-edge);
      }

      .sw-grid.brand .sw {
        width: 33.3333%;

      }

      .sw-grid.mine .sw {

      }

      /* hover / 选中反馈。
         ⚠️ 设计稿用 box-shadow，本项目最低版本（PS 2024）拿不到，
         改成**真实描边元素**向外扩 2px —— 视觉等价，且一定生效。 */
      .sw-ring {
        display: none;
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border: 2px solid var(--vt-ac);
        pointer-events: none;
      }

      .sw:hover .sw-ring,
      .sw.is-ho .sw-ring {
        display: block;
      }

      .sw:hover,
      .sw.is-ho {
        z-index: 2;
      }

      /* 「我的颜色」右上角的删除 ✕。
         ⚠️ 之前"看不到 ✕"不是 CSS 问题，是 SVG 不继承 fill → 黑叉压深底。
         这里同时把尺寸提到 18px、描边加粗，进一步提升可辨识度。 */
      .sw-del {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 12, 12, 0.6);
        color: #ffffff;
        cursor: pointer;
      }

      .sw-del:hover {
        background: rgba(0, 0, 0, 0.88);
      }

      .sw-del .i {
        width: 11px;
        height: 11px;
      }

      .tip {
        display: none;
        position: absolute;
        z-index: 9;
        padding: 3px 7px;
        border-radius: 3px;
        background: var(--vt-sink);
        border: 1px solid var(--vt-line);
        font-size: 11px;
        color: var(--vt-tx);
        white-space: nowrap;
        pointer-events: none;
      }

      .tip.is-on {
        display: block;
      }

      .empty {
        padding: 22px 12px;
        text-align: center;
      }

      .empty-t {
        margin: 0 0 5px;
        font-size: 12px;
        color: var(--vt-tx2);
      }

      .empty-s {
        margin: 0;
        font-size: 11px;
        color: var(--vt-tx3);
      }

      /* 操作提示条：行距按用户反馈加大（原来 gap 6px + 行高 1.45 偏挤） */
      .hints {
        display: block;
        margin-top: 6px;
        padding: 10px 11px 4px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
      }

      .hints p {
        display: block;
        margin: 0 0 9px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--vt-tx2);
      }

      .kbd {
        display: inline-block;
        margin-right: 8px;
        padding: 1px 6px;
        border-radius: 2px;
        background: var(--vt-raised);
        border: 1px solid var(--vt-line);
        color: var(--vt-tx);
        font-size: 11px;
        line-height: 1.5;
        white-space: nowrap;
      }
      /* ------------------------------------------------------------ 素材库 (M2)
         数据来自「镜像」（见 D:\vellum-link\LINK-CONTRACT.md）。
         ⚠️ 三条纪律在本节各有一处体现，改之前先读文件头：
            · 网格是 **flex-wrap + 百分比**（无 Grid）；间距一律 margin（无 gap）
            · 所有可点元素是 `div[role="button"]`（无 <button>）
            · 缩略图容器**必须可见**（display:none 里 UXP 根本不加载图片）
      */
      /* 素材库页：**整页撑满 + 内部只有一个滚动区**（v0.3.3，用户要求）
         🔴 用户原话：「滚动条应当嵌入瀑布流中，不然还是会导致置入下面的图还要跑回顶部点击置入」。
         改法：页面拆成「固定区（库选择 / 筛选 / 详情置入）+ 滚动区（只有瀑布流）」，
         置入按钮永远在视野里，素材再多也不必滚回顶部。
         ⚠️ 用绝对定位撑满 `.scroll`：父级 .screen 是高 auto 的 block，
            `height:100%` 在那条链上解析不出高度（会退化成 auto）。 */
      .s-lib {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px 14px 0;
      }

      /* ── 新建稿页（模板库入口，v0.9.12）──────────────────────────────────
         三段式与素材库**同一套**：顶部目录固定 / 中间网格滚动 / 底部详情固定。
         🔴 模板属于「新建稿」页、不属于素材库（契约 §5.7），所以这里是**独立页面**，
            不复用 `.s-lib` 的类名 —— 免得以后改素材库顺手把模板页带坏。 */
      .s-nd {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px 14px 0;
      }

      .nd-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: 0 0 auto;
        margin-bottom: 8px;
      }

      .nd-ttl {
        font-size: 12px;
        color: var(--vt-tx3);
      }

      /* 两个模式（从模板 / 按规范）：等宽两格，样式跟随旧 chips 的观感 */
      .nd-tabs {
        display: flex;
        flex: 0 0 auto;
        gap: 6px;
        margin-bottom: 8px;
      }

      .nd-tab {
        flex: 1 1 0;
        height: 24px;
        line-height: 22px;
        text-align: center;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        font-size: 11px;
        color: var(--vt-tx3);
        cursor: pointer;
      }

      .nd-tab:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .nd-tab.is-on {
        background: var(--vt-surf2);
        border-color: var(--vt-line);
        color: var(--vt-tx);
        font-weight: 600;
      }

      .nd-bar {
        flex: 0 0 auto;
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--vt-line2);
      }

      /* 中间**唯一滚动区** */
      .nd-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 8px;
      }

      /* 🔴 **UXP 不支持 CSS Grid**（2026-10-17 真机踩到）：
         `display:grid` 下容器与子项的高度全算成 **0** —— 数据有 3 条、卡片也建好了，
         屏幕上却一片空白，而且 **不报错**（`offsetHeight` 全是 0，是唯一的线索）。
         ⇒ 一律用 flex + 百分比宽度做两列（素材库的瀑布流也是 flex，没有用 grid）。 */
      /* 🔴 **用固定卡宽，不用百分比**（v0.9.31 定案）。
         为什么：缩略图要正方形 ⇒ 高度必须等于"卡内可用宽"。
         · 用 `48.5%` 的话，卡宽随面板变 ⇒ 只能靠 JS 量了再改高度，
           而**"在 UXP 里量尺寸"这件事本身就不可靠**（布局落定时机难判，
           本轮为此连错三版：168×174 / inline height 为空）。
         · 改成固定 186px ⇒ 卡内可用宽 = 186 − padding 12 − border 2 = **172**，
           缩略图固定 172 高 ⇒ **必然正方形，零测量、零时机依赖**。
         ⚠️ **宽度是 186 不是 193**：面板内容宽 394 看着够放 2×193，但
           **出现滚动条时要再扣掉约 15px**（实测只剩 379）⇒ 193×2=386 **放不下，卡片会掉成一列**。
           186×2 = 372 < 379 ⇒ 两列稳。改这个数**必须同时改缩略图高度**（差 = 14）。
         面板更宽时两列左右分开（space-between），卡片仍是正方形。 */
      .nd-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .nd-card {
        display: block;
        width: 186px;
        margin: 0 0 8px;
        padding: 6px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
        cursor: pointer;
        box-sizing: border-box;
      }

      .nd-card:hover {
        border-color: var(--vt-tx4);
      }

      .nd-card.is-on {
        border-color: var(--vt-ac);
      }

      /* 缩略图盒子：**正方形**（v0.9.26 用户拍板，按 512 信息卡整版显示）。
         ── 背景：软件侧 2026-10-17 把缩略图从「PSD 预览」换成「512×512 信息卡」，
            上面画了品类 / 成品尺寸 / 出血 / 色彩模式。缩到 120 高时那几行小字只剩 ≈5px，
            **出血和色彩模式基本是糊的** ⇒ 用户选「按正方形铺满列宽」，牺牲一屏行数换可读性。
         · 图是**不透明浅色**（#fbfaf7）⇒ 盒子底色必须跟它一致，否则留白会露成深色条。
         · `object-fit: contain` ⇒ **不裁切、不拉伸**，512 方图 / 72×160 竖图 / 160 方图
           都能正常显示（我们从来没有假设过缩略图的尺寸或比例）。
         · 高度 172 = 卡宽 186 − padding 12 − border 2 ⇒ **正方形是算出来的，不是量出来的**。 */
      .nd-th {
        position: relative;
        /* 172 = 卡宽 186 − 左右 padding 12 − 左右边框 2（**border-box**，边框也算在 186 里）
           ⇒ 盒子宽高相等 = 正方形。**改卡宽/内边距时必须同步改这个数**（差 = 14）。 */
        height: 172px;
        border-radius: 2px;
        background: #fbfaf7;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .nd-ph {
        font-size: 10px;
        color: var(--vt-tx4);
        letter-spacing: 1px;
      }

      .nd-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .nd-nm {
        display: block;
        margin-top: 5px;
        font-size: 11px;
        color: var(--vt-tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .nd-mt {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--vt-tx4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 底部固定详情（复用 `.lf-*` 的排版，视觉与素材库那一条一致） */
      .nd-foot {
        flex: 0 0 auto;
        margin: 10px 0;
        padding: 8px 10px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
      }

      /* 固定区：不参与伸缩，永远可见（`.lib-body` 才是唯一的滚动区） */
      .lib-top,
      .lib-meta,
      .lib-metanote,
      .lib-bar,
      .lib-foot {
        flex: 0 0 auto;
      }

      /* 库切换行：chips 左、刷新右。用 flex-wrap 而不是 gap 排布 */
      .lib-top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        margin-bottom: 2px;
      }

      .lib-tabs {
        display: flex;
        flex-wrap: wrap;
        flex: 1 1 auto;
        min-width: 0;
      }

      .ltab {
        display: inline-block;
        height: 26px;
        line-height: 24px;
        padding: 0 10px;
        margin: 0 6px 6px 0;
        border-radius: 3px;
        border: 1px solid var(--vt-line);
        background: var(--vt-surf2);
        color: var(--vt-tx2);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .ltab:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .ltab.is-on {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .ltab .lt-n {
        margin-left: 6px;
        font-size: 11px;
        opacity: 0.75;
      }

      .lib-refresh {
        margin: 0 0 6px 0;
        flex: 0 0 auto;
      }

      .lib-meta {
        display: block;
        margin: 0 0 9px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-tx4);
        word-break: break-all;
      }

      /* 「镜像里只有 N 个库」的如实提示 —— 只在不足 2 个库时显示（默认 display:none） */
      .lib-metanote {
        margin: -5px 0 9px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--vt-warn);
        word-break: break-all;
      }

      /* 筛选区：最多三行（顶层分组 / 子组 / 来源）。
         外层改成 block —— 行与行要竖着排，flex 行会把三行并排。
         每行自己 flex-wrap：窄面板下 chips 要能换行，所以必须给底部间距，
         不能像旧版那样只留右间距（一换行上下就贴住了）。 */
      .lib-bar {
        display: block;
        min-height: 22px;
        margin-bottom: 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--vt-line2);
      }

      .frow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
      }

      /* chips 装在 .fchips 里（把左侧剩余宽度吃满）——
         这样**行尾还能再挂一个下拉**（通用库的二级子类就挂在同一行的最右边）。 */
      .fchips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        flex: 1 1 auto;
        min-width: 0;
      }

      .frow .fchip {
        margin: 0 6px 4px 0;
      }

      /* 子组行：缩进一层，一眼看出它在父组下面 */
      .frow.mid {
        padding-left: 10px;
      }

      .frow.src {
        margin-top: 2px;
      }

      .frow-lb {
        margin: 0 6px 4px 0;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .fchip {
        display: inline-block;
        height: 22px;
        line-height: 20px;
        padding: 0 8px;
        margin: 0 6px 0 0;
        border-radius: 3px;
        border: 1px solid var(--vt-line2);
        background: transparent;
        color: var(--vt-tx3);
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }

      /* 子组 chip 比父组小一号，层级关系光靠缩进在小面板里看不出来 */
      .fchip.sub {
        height: 20px;
        line-height: 18px;
        padding: 0 7px;
        font-size: 10px;
      }

      /* ── 自绘下拉（v0.3.0；v0.3.1 起「项目」与「二层子类」共用）
         为什么自绘：原生 <select> 外观改不动（与"样式沿用现有风格"冲突），
         而 Spectrum sp-picker 真机实测未注册 ⇒ 不可用。见 docs/25。 */
      .fsel-wrap {
        position: relative;
        display: inline-block;
        margin: 0 6px 4px 0;
      }

      /* 挂在**行尾**的下拉：自身不伸缩、贴右侧，宽度封顶（长名字靠 .fs-t 截断） */
      .fsel-wrap.push {
        flex: 0 0 auto;
        align-self: center;
        margin: 0 0 4px 8px;
        max-width: 150px;
      }

      .fsel {
        display: inline-block;
        max-width: 100%;
        height: 22px;
        line-height: 20px;
        padding: 0 6px 0 8px;
        border-radius: 3px;
        border: 1px solid var(--vt-line);
        background: var(--vt-surf);
        color: var(--vt-tx);
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }

      /* 触发条里的三个片段一律 `vertical-align: top`（内容盒正好 20px），
         否则"截断用的 inline-block"与"纯文本"基线不一致，三个片段会高低错位。 */
      .fsel .fs-t {
        display: inline-block;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: top;
      }

      /* 计数 / 箭头：**必须也做成 20px 高的 inline-block**，光写 `vertical-align: top` 不够 ——
         `top` 对**纯文本**是把「内容区顶部」贴到行盒顶（内容区只有 ~13px、行盒 20px
         ⇒ 它比居中位置**高约 3px**），而对 inline-block 才是「盒子顶贴行盒顶」（盒内文字居中）。
         两者混用 = 用户 2026-10-11 报的「数字比文字高一点」。 */
      .fsel .fs-n,
      .fsel .fs-cv {
        display: inline-block;
        height: 20px;
        line-height: 20px;
        vertical-align: top;
      }

      .fsel:hover {
        border-color: var(--vt-tx4);
      }

      .fsel.is-on {
        border-color: var(--vt-ac);
      }

      .fsel .fs-n {
        margin-left: 5px;
        opacity: 0.7;
      }

      .fsel .fs-cv {
        margin-left: 6px;
        font-size: 10px;
        color: var(--vt-tx3);
      }

      /* 展开的列表。
         ⚠️ 三条硬约束：
           ① 与触发条之间留 6px 间隙、且**不覆盖触发条本身**（覆盖会让指针一进入浮层，
              触发条就"失焦"，若隐藏逻辑再绑 hover 就是振荡回路 —— 调色板那次的教训）；
           ② **必须落在滚动容器 `.scroll` 之内** —— 它同时有 `overflow-y:auto` 与
              `overflow-x:hidden`，**越界会被裁掉**。这条在自检 S20c 里是**可测不变量**；
           ③ 因此浮层是**右对齐**展开的（`right:0` 而非 `left:0`）——
              这两个下拉都贴在**行尾**，往右展开必然越界。 */
      .fsel-pop {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 6px;
        min-width: 100%;
        max-width: 230px;
        max-height: 168px;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 30;
        padding: 3px;
        border: 1px solid var(--vt-line);
        border-radius: 3px;
        background: var(--vt-surf);
      }

      .fsel-wrap.is-open .fsel-pop {
        display: block;
      }

      .fopt {
        display: flex;
        align-items: center;
        padding: 3px 7px;
        border-radius: 2px;
        font-size: 11px;
        color: var(--vt-tx2);
        white-space: nowrap;
        cursor: pointer;
      }

      .fopt:hover {
        background: var(--vt-surf2);
        color: var(--vt-tx);
      }

      .fopt.is-on {
        color: var(--vt-tx);
      }

      /* `min-width:0` + 截断：选项名可能很长（项目名），浮层又有 max-width */
      .fopt .fo-t {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .fopt .fo-n {
        flex: 0 0 auto;
        margin-left: 12px;
        font-size: 10px;
        opacity: 0.65;
      }

      /* 顶部行里的「项目」下拉（仅任务库）：紧挨刷新按钮左侧 */
      .lib-proj {
        flex: 0 0 auto;
        margin: 0 0 6px 6px;
        max-width: 55%;
      }

      .fchip:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .fchip.is-on {
        background: var(--vt-surf);
        border-color: var(--vt-line);
        color: var(--vt-tx);
      }

      .fchip .fc-n {
        margin-left: 5px;
        opacity: 0.7;
      }

      /* ── 目录面包屑（v0.9.9，用户拍板的"方向 B：面包屑下钻"）──────────────
         只在下钻后出现（根层只显示一个「全部」是噪音）。
         🔴 它固定在这一块的最上面、**不能随网格滚走** —— 否则用户在深目录里会迷路。
         高度 ≈ 20 + 6 = 26px，从"两行 chips 60px"里省的（见 docs/55 §九 高度预算）。 */
      .bc {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        min-height: 20px;
        margin: 0 0 6px;
        font-size: 11px;
        overflow: hidden;
      }

      /* 每一段都可以很长 ⇒ 必须 min-width:0 + 省略号，否则整行被一段文件名撑爆 */
      .bc-s {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 104px;
        padding: 1px 4px;
        border-radius: 3px;
        color: var(--vt-tx3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      .bc-s:hover {
        color: var(--vt-tx);
        background: var(--vt-surf2);
      }

      /* 当前层：加粗、**不可点**（点了还是原地，纯属骗人） */
      .bc-s.is-on {
        color: var(--vt-tx);
        font-weight: 600;
        cursor: default;
        background: transparent;
      }

      .bc-sep {
        flex: 0 0 auto;
        margin: 0 1px;
        color: var(--vt-tx4);
      }

      /* 「共 N 张」靠右，不参与压缩 */
      .bc-n {
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 8px;
        font-size: 10px;
        color: var(--vt-tx4);
        white-space: nowrap;
      }

      /* ── 子目录列表（v0.9.10：**整行**，以 mock 为准）──────────────────
         用户对过 mock 后指出"新 UI 不是这个吗"—— 设计稿是行、不是 chips。
         行的好处：目录名常常很长（chips 会被挤成省略号）、点按目标 26px 比 22px 好点。
         一行 26 + 3 间距 = 29px；**超过 3 行就折叠**（子目录数量由软件侧决定）。 */
      .dirs {
        display: block;
        margin: 0 0 4px;
      }

      .dir {
        display: flex;
        align-items: center;
        height: 26px;
        padding: 0 8px;
        margin: 0 0 3px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        color: var(--vt-tx3);
        font-size: 12px;
        cursor: pointer;
      }

      .dir:hover {
        border-color: var(--vt-tx4);
        color: var(--vt-tx);
      }

      .dir .i {
        margin-right: 7px;
        opacity: 0.85;
      }

      /* 名字占满剩余宽度，超长省略 —— 行高不因名字变长而变（这是高度预算的前提） */
      .dir .dn {
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dir .dc {
        flex: 0 0 auto;
        margin-left: 8px;
        font-size: 10px;
        color: var(--vt-tx4);
      }

      /* 折叠开关（「还有 N 个」/「收起」）：虚线边框 + 居中，与真实目录区分开 */
      .dir.more {
        border-style: dashed;
        justify-content: center;
        color: var(--vt-tx4);
      }

      /* 目录行的选中态（规范列表用它表示"当前选的规格"） */
      .dir.is-on {
        border-color: var(--vt-ac);
        color: var(--vt-tx);
      }

      .lib-count {
        font-size: 11px;
        color: var(--vt-tx4);
      }

      /* 唯一的滚动区（v0.3.3）：滚动条只出现在瀑布流这一块里。
         `min-height:0` 是 flex 子项能真正滚起来的必要条件（否则会被内容撑高）。 */
      .lib-body {
        display: block;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        /* v0.9.8：插入面板已移到**下方固定**，它自己的 margin-top 提供了间距，
           这里不用再留 22px（否则滚动区底部白一截，最后一行看起来"没到头"）。 */
        padding-bottom: 8px;
      }

      /* 瀑布流（v0.3.4，用户要求"缩略图容器与缩略图比例一致"）
         ══════════════════════════════════════════════════════════════
         两列**各自纵向堆叠**，不再用 flex-wrap —— 卡片高度随缩略图比例变化，
         wrap 会按"行高 = 本行最高"对齐，短卡片下面留一大片空隙（也就不是瀑布流了）。
         分派规则在 JS：每张卡片按"当前累计高度较小的一列"投放（见 library.js renderGrid）。
         ⚠️ 网格仍是 flex + 百分比，不用 Grid / gap（UXP 不支持）。 */
      .lib-grid {
        display: flex;
        align-items: flex-start;
        margin: 0 -5px;
      }

      .lib-col {
        width: 50%;
        display: flex;
        flex-direction: column;
      }

      .card {
        width: 100%;
        padding: 0 5px 10px;
        cursor: pointer;
      }

      .card-in {
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
        overflow: hidden;
      }

      .card:hover .card-in,
      .card.is-on .card-in {
        border-color: var(--vt-ac);
      }

      /* 缩略图区：**高度由 JS 按缩略图比例算好写成 inline style**
         （v0.3.4 瀑布流：1600×2200 的图就该比 2408×2048 的图高一截）。
         这里的 120px 只是**没算出比例时的保底**（例如 asset 缺 width/height
         且缩略图还没加载完），不参与正常路径。 */
      .card-th {
        position: relative;
        height: 120px;
        background: var(--vt-sink);
        border-bottom: 1px solid var(--vt-line2);
        overflow: hidden;
      }

      /* 容器比例 = 图片比例 ⇒ contain/cover 等价；用 cover 是为了万一缩略图
         与原图比例有一两像素取整误差时**不留白边**（宁可裁掉半点边缘）。 */
      .card-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-ph {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .card-ext {
        position: absolute;
        right: 0;
        top: 0;
        padding: 1px 4px;
        background: rgba(12, 12, 12, 0.62);
        color: #ffffff;
        font-size: 10px;
        line-height: 1.5;
      }

      .card-miss {
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 1px 5px;
        background: #8e2f2f;
        color: #ffffff;
        font-size: 10px;
        line-height: 1.6;
      }

      /* 来源角标（契约 §5.4 可选 asset.source）
         —— 只在「两种来源混排」时才出现；右下角与左下角的「原文件丢失」对称。
         「我的」用主色实底，和扩展名/丢失那种"中性深底"区分开。 */
      .card-src {
        position: absolute;
        right: 0;
        bottom: 0;
        padding: 1px 5px;
        background: rgba(12, 12, 12, 0.62);
        color: #ffffff;
        font-size: 10px;
        line-height: 1.6;
      }

      .card-src.is-user {
        background: var(--vt-ac);
      }

      .card-nm {
        display: block;
        padding: 6px 7px 1px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--vt-tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-mt {
        display: block;
        padding: 0 7px 7px;
        font-size: 11px;
        color: var(--vt-tx4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 选中详情 + 置入（v0.9.8 起**固定在面板底部** —— 用户拍板的三段式：
         目录固定上 / 插入固定下 / 中间只有网格滚动。它 `flex: 0 0 auto` ⇒ 不随网格滚走，
         所以 v0.3.2 那个"选完素材要滚到最底下按置入"的痛点不会回来。 */
      .lib-foot {
        margin: 10px 0 10px;
        padding: 9px 10px;
        border: 1px solid var(--vt-line2);
        border-radius: 3px;
        background: var(--vt-surf2);
      }

      /* ── 插入面板（v0.9.7 重新设计；用户 2026-10-17 拍板）─────────────
         形态：左＝素材名 + 一行元信息，右＝「置入」两字按钮。
         🔴 硬指标：**选中时总高 ≤ 50px**。省空间的主力是**去掉落点九宫格（66px）**，
            不是按钮宽度 —— 所以别为了"信息更全"往回加行。
         ⚠️ 位置 / 标签 / 原图路径**不在版面上**，全部进 `title`（hover 看）：
            平时不看，排障时要能拿到。 */
      .lib-foot {
        flex: 0 0 auto;
        /* 🔴 水平内边距**必须有**：这个块有 border + background，是张"卡片"。
           写成 0 时文字贴左边框、按钮贴右边框，看起来就是"溢出"（用户 2026-10-17 截图报障）。
           外层 `.s-lib` 的 14px 是卡片**外面**的留白，管不到卡片内部。
           ⚠️ 只加水平方向 —— 垂直方向一动，S71 的 40～56px 判据就要重新核。 */
        padding: 8px 10px;
      }

      .lf-hint {
        display: block;
        font-size: 11px;
        color: var(--vt-tx4);
      }

      .lf-main {
        display: flex;
        align-items: center;
      }

      /* 左块**必须** min-width:0 —— 否则长文件名会把右侧按钮挤出面板 */
      .lf-l {
        flex: 1 1 auto;
        min-width: 0;
      }

      .lf-n {
        display: block;
        font-size: 12px;
        color: var(--vt-tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .lf-m {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--vt-tx4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 「置入」两字按钮：宽约 44px（2 字 × 12 + 左右各 10）。
         为什么不用 icon：340 宽面板里名称区还剩 ~270px（够 22 个中文字），
         而箭头图标需要用户去猜，置入又是高频操作。 */
      .lf-btn {
        flex: 0 0 auto;
        height: 24px;
        line-height: 22px;
        padding: 0 10px;
        margin-left: 8px;
        border-radius: 3px;
        background: var(--vt-ac);
        color: #ffffff;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .lf-btn:hover {
        background: var(--vt-ac-hi);
      }

      /* 不可置入（原文件丢失 / 类型不支持）：置灰但**不隐藏** —— 原因在 title 里 */
      .lf-btn.is-off {
        opacity: 0.45;
        cursor: default;
      }

      /* 主按钮（复用 .mini 的形状）+ 不可用态 */
      .mini.pri {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .mini.pri:hover {
        background: var(--vt-ac-hi);
        border-color: var(--vt-ac-hi);
        color: #ffffff;
      }

      .mini.is-off {
        opacity: 0.45;
        cursor: default;
      }

      .mini.is-off:hover {
        border-color: var(--vt-line);
        color: var(--vt-tx2);
      }

      .mini.pri.is-off:hover {
        background: var(--vt-ac);
        border-color: var(--vt-ac);
        color: #ffffff;
      }

      .lib-retry {
        margin-top: 10px;
      }
    </style>
  <style>
      /* ==========================================================================
         M3 表格生成（v0.4.0）—— 方向「工作台 + 列抽屉」
         ⚠️ UXP 的 CSS 是子集：无 gap、无 Grid、无伪元素；间距一律 margin。
            表格预览**不能**用 <table>，所以是「每行一个 flex 行 + 百分比宽」拼出来的。
         ========================================================================== */
      .s-tbl {
        position: absolute; left: 0; top: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; box-sizing: border-box; padding: 12px 14px 0;
      }
      .tbl-top, .tbl-foot { flex: 0 0 auto; }
      .tbl-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 4px; }

      .tbl-src { display: flex; align-items: center; background: var(--vt-surf2);
        border: 1px solid var(--vt-line2); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; }
      .tbl-src .nm { flex: 1 1 auto; font-family: var(--vt-mono); font-size: 11.5px; color: var(--vt-tx);
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .tbl-src .cnt { flex: 0 0 auto; font-family: var(--vt-mono); font-size: 11px; color: var(--vt-tx3); margin-left: 8px; }

      /* v0.4.2：内置样例那一行 —— 系统文件选择器自动化点不了，
         所以给一条"不弹窗"的同源入口（读了字节之后的链路完全一样）。 */
      .tbl-try { display: flex; align-items: center; margin: 0 0 8px; }
      .tbl-try .lb { flex: 0 0 auto; font-size: 11px; color: var(--vt-tx3); }

      .tbl-empty { padding: 20px 4px; text-align: center; color: var(--vt-tx3); font-size: 12px; line-height: 1.75; }
      .tbl-enc { display: flex; align-items: flex-start; font-size: 11px; color: var(--vt-tx3); line-height: 1.55; margin: 0 0 8px; }
      .tbl-enc b { color: var(--vt-ok); font-weight: 400; }
      .tbl-enc.bad b { color: var(--vt-warn); }

      .tbl-wrap { border: 1px solid var(--vt-line2); border-radius: 4px; background: var(--vt-sink);
        max-height: 152px; overflow-y: auto; overflow-x: hidden; margin-bottom: 8px; }
      .tbl-row { display: flex; border-bottom: 1px solid var(--vt-hair); }
      .tbl-row:last-child { border-bottom: 0; }
      .tbl-row.hd { background: var(--vt-raised); }
      .tbl-c { font-size: 10.5px; line-height: 1.5; padding: 5px 6px; box-sizing: border-box;
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--vt-tx2); }
      .tbl-row.hd .tbl-c { color: var(--vt-tx); font-weight: 500; }
      .tbl-row.hd .tbl-c:hover { background: #4d4d4d; }
      .tbl-c.hot { background: var(--vt-ac); color: #fff; }

      .tbl-drawer { border: 1px solid var(--vt-ac); border-radius: 4px; background: var(--vt-surf2);
        padding: 8px 9px; margin-bottom: 8px; }
      .tbl-dh { display: flex; align-items: center; margin-bottom: 6px; }
      .tbl-dh .t { flex: 1 1 auto; font-size: 11.5px; font-weight: 500; color: var(--vt-tx); }

      .tbl-grp { border: 1px solid var(--vt-line2); border-radius: 4px; background: var(--vt-surf2); margin-bottom: 8px; }
      .tbl-gh { display: flex; align-items: center; height: 30px; padding: 0 9px; }
      .tbl-gh .t { flex: 1 1 auto; font-size: 11.5px; color: var(--vt-tx); }
      .tbl-gh .n { flex: 0 0 auto; font-family: var(--vt-mono); font-size: 10.5px; color: var(--vt-tx3); margin-right: 8px; }
      /* 🔴 v0.4.4：原来的"折角三角"是用 border 技巧画的（border-left/right 透明 + border-top 上色）。
         UXP **不支持透明边框** ⇒ 真机上退化成一个**实心黑方块**、还贴在右边缘（用户报的第 5 条）。
         已整个去掉：折叠状态由"内容显不显示"表达就够了，不需要额外图标。 */
      .tbl-grp.closed .tbl-gb { display: none; }
      .tbl-gb { padding: 2px 9px 9px; }

      .tf { display: flex; align-items: center; min-height: 26px; margin-bottom: 3px; }
      .tf .lb { flex: 0 0 86px; font-size: 11.5px; color: var(--vt-tx2); }
      /* ⚠️ `.ct` 写成**全局**（不是 `.tf .ct`）：内边距那一行的 4 个步进器也用 `.ct`，
         而它并不在 `.tf` 里 —— 原来靠 UXP 的默认块级行为"恰好"排成一行，不可移植。 */
      .ct { flex: 1 1 auto; display: flex; align-items: center; }

      .tseg { display: flex; flex: 1 1 auto; border: 1px solid var(--vt-line); border-radius: 4px; overflow: hidden; }
      .tseg > div { flex: 1 1 0; height: 24px; line-height: 24px; text-align: center;
        font-size: 11.5px; color: var(--vt-tx2); background: var(--vt-sink); }
      .tseg > div + div { border-left: 1px solid var(--vt-line); }
      .tseg > div.on { background: var(--vt-ac); color: #fff; }
      .tseg > div:hover { color: var(--vt-tx); }
      .tseg > div.on:hover { color: #fff; }

      /* 🔴 v0.4.6：步进器容器**必须显式给 `width`**。
         真机字符画证明：`[−][12][+]` 的**子元素位置其实是对的**（`12` 正好落在 22+21 处、
         `+` 落在 177 处），但**边框盒只画了 32px** —— UXP 算 flex 容器**自身**尺寸时，
         按子元素的"**内容宽**"求和，**不认 `flex-basis`**。
         ⇒ `flex: 0 0 auto`（v0.4.4 加的）只能管"别被压缩"，管不了"我该画多宽"，
            所以用户看到的仍然不对：「边框只包住 −，数字和 + 掉在框外」。
         ⇒ 现在把宽度写死：88 = 1 + 22 + 42 + 22 + 1（box-sizing: border-box）。
         📌 纪律：**UXP 里凡是靠 flex 容器自己算尺寸的地方，都要给显式 width/height**。 */
      .tnum { display: flex; align-items: center; flex: 0 0 auto; box-sizing: border-box;
        width: 88px; height: 24px; border: 1px solid var(--vt-line); border-radius: 4px;
        background: var(--vt-sink); }
      .tnum .mn, .tnum .pl { flex: 0 0 22px; text-align: center; line-height: 22px; color: var(--vt-tx2); font-size: 13px; }
      .tnum .mn:hover, .tnum .pl:hover { background: var(--vt-raised); color: var(--vt-tx); }
      .tnum .vl { flex: 0 0 42px; text-align: center; font-family: var(--vt-mono); font-size: 11.5px; color: var(--vt-tx); }
      /* 紧凑版：内边距那一行要放 **4 个**（`.ct` 可用的宽度约 308px）。
         64 = 1 + 16 + 30 + 16 + 1；四个 64 + 三个 5px 间距 = 271 ≤ 308 ✓ */
      .tnum.cpt { width: 64px; }
      .tnum.cpt .mn, .tnum.cpt .pl { flex: 0 0 16px; font-size: 12px; }
      .tnum.cpt .vl { flex: 0 0 30px; font-size: 11px; }
      .tunit { font-size: 11px; color: var(--vt-tx3); margin-left: 6px; }

      .tclr { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--vt-line); margin-left: 8px; }
      .tclr-t { font-family: var(--vt-mono); font-size: 11px; color: var(--vt-tx2); margin-left: 5px; }

      .tnote { font-size: 11px; color: var(--vt-tx3); line-height: 1.6; margin: 5px 0 0; }
      .twarn { display: flex; align-items: flex-start; background: rgba(232,182,94,.14);
        border: 1px solid rgba(232,182,94,.42); border-radius: 4px; padding: 6px 8px;
        font-size: 11px; color: var(--vt-warn); line-height: 1.55; margin-bottom: 8px; }
      .tdot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin: 5px 6px 0 0; }

      /* v0.5.0 M3b：绑定用的"芯片组"（自绘 —— 不用 <select>（UXP 里外观改不动）、
         也不用浮层（面板在 .tbl-body 里会被 overflow 裁掉））。
         布局交给 inline-block 的文本流，不赌 UXP 的 flex-wrap。 */
      .tchips { margin: 2px 0; }
      .tchip { display: inline-block; padding: 0 7px; height: 20px; line-height: 19px; box-sizing: border-box;
        border: 1px solid var(--vt-line); border-radius: 3px; background: var(--vt-sink);
        color: var(--vt-tx2); font-size: 11px; margin: 0 4px 4px 0; max-width: 148px;
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .tchip:hover { background: var(--vt-raised); color: var(--vt-tx); }
      .tchip.on { background: var(--vt-ac); border-color: var(--vt-ac); color: #fff; }
      .tchip.dim { color: var(--vt-tx3); }
      /* "仍然生成…"那个状态：用警示色，但仍然是同一个按钮（不弹对话框） */
      .tbtn.warn { background: rgba(232,182,94,.92); border-color: rgba(232,182,94,.92); color: #1a1a1a; }
      .tbtn.warn:hover { background: #e8b65e; border-color: #e8b65e; }

      .ttabs { display: flex; border-bottom: 1px solid var(--vt-line); margin-bottom: 8px; }
      .ttabs > div { padding: 5px 9px; font-size: 11.5px; color: var(--vt-tx3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .ttabs > div.on { color: var(--vt-tx); border-bottom-color: var(--vt-ac); }

      .tbtn { height: 26px; padding: 0 12px; border: 1px solid var(--vt-line); border-radius: 4px;
        background: var(--vt-surf); color: var(--vt-tx); display: flex; align-items: center;
        justify-content: center; font-size: 12px; box-sizing: border-box; }
      .tbtn:hover { background: var(--vt-raised); }
      .tbtn.pri { background: var(--vt-ac); border-color: var(--vt-ac); color: #fff; }
      .tbtn.pri:hover { background: var(--vt-ac-hi); border-color: var(--vt-ac-hi); }
      .tbtn.gh { background: transparent; border-color: transparent; color: var(--vt-tx2); }
      .tbtn.gh:hover { background: var(--vt-raised); color: var(--vt-tx); }
      .tbtn.sm { height: 22px; padding: 0 9px; font-size: 11.5px; }
      .tbtn.off { opacity: .4; }
      .tbtn.busy { opacity: .6; }

      .tbl-foot { display: flex; align-items: center; border-top: 1px solid var(--vt-line2);
        background: var(--vt-surf2); padding: 9px 0; }
      .tbl-grow { flex: 1 1 auto; }
    </style>
  </head>

  <body>
    <div class="app" id="vt-app">
      <div class="brandbar"></div>

      <header class="bar" id="vt-bar">
        <div class="back is-off" id="vt-back" role="button" tabindex="0" title="返回"></div>
        <img class="bar-logo" id="vt-logo" src="icons/logo-mark.png" alt="Vellum" />
        <span class="bar-title" id="vt-title">Vellum 工具箱</span>
        <span class="bar-sub" id="vt-sub"></span>
        <span class="grow"></span>
        <div class="bar-chip" id="vt-chip" role="button" tabindex="0" title="点击查看运行环境">
          <i class="led" id="vt-led"></i><span class="mono" id="vt-env">…</span>
        </div>
      </header>

      <div class="scroll" id="vt-body">
        <section class="screen active" id="vt-home"></section>
        <section class="screen" id="vt-tool-view"></section>
      </div>

      <div class="statusbar" id="vt-status">
        <div class="vchip" id="vt-inspect" role="button" tabindex="0" title="点击查看出图体检">
          <i class="led off" id="vt-inspect-led"></i><span class="vchip-tx" id="vt-inspect-tx">体检：…</span>
        </div>
        <div class="vchip is-act" id="vt-undo" role="button" tabindex="0" title="一步退回这次批量操作之前" style="display: none">
          <i class="led" id="vt-undo-led"></i><span class="vchip-tx" id="vt-undo-tx">撤销</span>
        </div>
        <div class="stx" id="vt-status-tx">就绪。</div>
      </div>
    </div>
  </body>
</html>
